[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-data-pipeline-optimization"
version = "1.0.0"
description = "A reproducible retail data pipeline with validation and SQL performance benchmarking"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb==1.3.2",
    "pandas==2.2.3",
    "numpy==2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
